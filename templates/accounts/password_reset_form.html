{% extends "accounts/base.html" %}
{% block title %}Recuperar senha — FiscalSema{% endblock %}
{% block content %}
  <h1>Recuperar senha</h1>
  <p>Informe seu e-mail. A resposta será a mesma exista ou não uma conta correspondente.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Solicitar recuperação</button>
  </form>
{% endblock %}
