<div class="assistant-attachment" data-assistant-attachment hidden>
  <span class="assistant-attachment-chip"><span aria-hidden="true">📎</span> <span data-attachment-name></span><button type="button" class="assistant-attachment-remove" data-attachment-remove title="Remover anexo"><span aria-hidden="true">×</span><span class="visually-hidden">Remover anexo</span></button></span>
  <span class="assistant-attachment-note">Não anexe documentos reais nesta demonstração. O texto do arquivo é enviado ao serviço de IA externo (Google Gemini) só para responder esta pergunta e não é guardado.</span>
</div>
<label class="assistant-attach" for="{{ prefix }}-anexo" title="Anexar TR ou contrato (PDF ou DOCX, até 4 MB)">
  <span aria-hidden="true">📎</span><span class="visually-hidden">Anexar TR ou contrato (PDF ou DOCX, até 4 MB)</span>
</label>
<input class="visually-hidden" type="file" id="{{ prefix }}-anexo" name="anexo" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" data-attachment-input>
