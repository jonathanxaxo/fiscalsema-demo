<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><style>
.scan{animation:scan 3s ease-in-out infinite}
.tick{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 3s ease-in-out infinite}
.ring{transform-origin:21px 21px;animation:pulse 3s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateX(-4px)}50%{transform:translateX(5px)}}
@keyframes draw{0%,25%{stroke-dashoffset:24}55%,100%{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.scan,.tick,.ring{animation:none}.tick{stroke-dashoffset:0}}
</style><defs><linearGradient id="fsbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d6b44"/><stop offset="1" stop-color="#062b1c"/></linearGradient><clipPath id="fslens"><circle cx="21" cy="21" r="11"/></clipPath></defs><rect width="48" height="48" rx="12" fill="url(#fsbg)"/><circle class="ring" cx="21" cy="21" r="14.5" fill="none" stroke="#44dc9c" stroke-width="1.2"/><circle cx="21" cy="21" r="11.5" fill="#0b5d3b" stroke="#44dc9c" stroke-width="2.6"/><g clip-path="url(#fslens)"><rect class="scan" x="14" y="8" width="2" height="26" rx="1" fill="#f5b301" opacity=".85"/></g><path class="tick" d="M15.5 21.5l4 4 7.5-8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 30l9 9" stroke="#f5b301" stroke-width="5" stroke-linecap="round"/></svg>
