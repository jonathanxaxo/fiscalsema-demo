<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><style>
.scan{animation:scan 3s ease-in-out infinite alternate}
.beam{animation:scan 3s ease-in-out infinite alternate}
.glass{animation:glass 3s ease-in-out infinite}
.tick{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 3s ease-in-out infinite}
.ring{transform-origin:21px 21px;animation:pulse 3s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-3px)}100%{transform:translateX(13px)}}
@keyframes glass{0%,100%{fill-opacity:0}50%{fill-opacity:.18}}
@keyframes draw{0%,25%{stroke-dashoffset:24}55%,100%{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.035)}}
</style><defs><linearGradient id="fsbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b5ed7"/><stop offset="1" stop-color="#083b8a"/></linearGradient><linearGradient id="fsbeam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4da3ff" stop-opacity="0"/><stop offset=".5" stop-color="#4da3ff" stop-opacity=".45"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></linearGradient><clipPath id="fslens"><circle cx="21" cy="21" r="11"/></clipPath></defs><rect width="48" height="48" rx="12" fill="url(#fsbg)"/><path d="M10 5h14.5l7.5 7.5V37a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="#fff"/><path d="M24.5 5v5.5a2 2 0 0 0 2 2H32" fill="#cfe2ff"/><path d="M12 34.5h12M12 37h8" stroke="#9cc3f5" stroke-width="1.4" stroke-linecap="round"/><circle class="ring" cx="21" cy="21" r="14.5" fill="none" stroke="#4da3ff" stroke-width="1.2"/><circle cx="21" cy="21" r="11.5" fill="#eaf3ff" stroke="#092b55" stroke-width="2.6"/><g clip-path="url(#fslens)"><path d="M11 16h20M11 21h20M11 26h14" stroke="#0b5ed7" stroke-opacity=".28" stroke-width="2.2" stroke-linecap="round"/><circle class="glass" cx="21" cy="21" r="11" fill="#4da3ff" fill-opacity="0"/><rect class="beam" x="10" y="8" width="10" height="26" fill="url(#fsbeam)"/><rect class="scan" x="14" y="8" width="2" height="26" rx="1" fill="#0b5ed7" opacity=".7"/></g><path class="tick" d="M15.5 21.5l4 4 7.5-8" fill="none" stroke="#083b8a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 30l9 9" stroke="#092b55" stroke-width="7" stroke-linecap="round"/><path d="M30 30l9 9" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/></svg>