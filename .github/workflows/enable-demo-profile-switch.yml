name: Habilitar troca de perfil do administrador do FiscalSema Demo

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: E-mail (login) do Administrador que podera atuar como Fiscal
        required: true
        type: string
      organization_name:
        description: Organizacao usada quando atuar como Fiscal
        required: true
        default: SEMA
        type: string
      fiscal_name:
        description: Nome exibido quando atuar como Fiscal
        required: true
        default: Admin
        type: string
      confirmacao:
        description: Digite HABILITAR para confirmar
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fiscalsema-demo-initial-administrator
  cancel-in-progress: false

jobs:
  enable-profile-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.14.7-slim-bookworm
    env:
      APP_ENVIRONMENT: demo
      DJANGO_SETTINGS_MODULE: core.settings_demo
      ALLOWED_HOSTS: fiscalsema-demo.vercel.app
      CSRF_TRUSTED_ORIGINS: https://fiscalsema-demo.vercel.app
      FISCALSEMA_DEMO_DATABASE_URL: ${{ secrets.FISCALSEMA_DEMO_MIGRATION_DATABASE_URL }}
      DEMO_ADMIN_EMAIL: ${{ inputs.admin_email }}
      DEMO_SWITCH_ORGANIZATION: ${{ inputs.organization_name }}
      DEMO_SWITCH_FISCAL_NAME: ${{ inputs.fiscal_name }}
      CONFIRMACAO: ${{ inputs.confirmacao }}
    steps:
      - name: Exigir confirmacao explicita
        run: test "$CONFIRMACAO" = "HABILITAR"

      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Exigir o segredo do banco
        run: test -n "$FISCALSEMA_DEMO_DATABASE_URL"

      - name: Gerar chave Django efemera
        run: python -c "import secrets; print('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(64))" >> "$GITHUB_ENV"

      - name: Instalar dependencias verificadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Validar configuracao e migrations aplicadas
        run: |
          python manage.py check --deploy
          python manage.py migrate --check

      - name: Habilitar a troca de perfil
        run: python manage.py enable_demo_profile_switch

      - name: Confirmar vinculo e protecoes
        run: |
          python manage.py shell -c "import os; from accounts.models import ProfileSwitchLink, UserProfile; link = ProfileSwitchLink.objects.select_related('administrator', 'fiscal').get(administrator__email__iexact=os.environ['DEMO_ADMIN_EMAIL']); assert ProfileSwitchLink.objects.count() == 1; assert link.administrator.is_superuser and link.administrator.profile == UserProfile.ADMINISTRATOR; assert link.fiscal.profile == UserProfile.FISCAL and not link.fiscal.is_superuser; assert not link.fiscal.has_usable_password(); assert link.fiscal.organization.is_active; print('PASS | Troca de perfil exclusiva, sem senha propria e auditavel')"
