name: Validacao do FiscalSema Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiscalsema-demo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: python:3.14.7-slim-bookworm
    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_DB: fiscalsema_demo_ci
          POSTGRES_USER: fiscalsema_demo_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        options: >-
          --health-cmd "pg_isready -U fiscalsema_demo_ci -d fiscalsema_demo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: core.settings_test
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      APP_ENVIRONMENT: demo
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_NAME: fiscalsema_demo_ci
      DATABASE_TEST_NAME: test_fiscalsema_demo_ci
      DATABASE_USER: fiscalsema_demo_ci
      DATABASE_PASSWORD: ci-only-not-a-production-secret
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DJANGO_LOG_DIR: /tmp/fiscalsema-ci-logs
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Verificar migrations e configuracao
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check --settings=core.settings_test

      - name: Verificar configuracao Vercel sem acessar banco
        env:
          DATABASE_URL: postgresql://fiscalsema_demo_runtime@demo-db.invalid/fiscalsema_demo?sslmode=require
          VERCEL_URL: fiscalsema-demo-ci.vercel.app
        run: |
          python manage.py check --deploy --settings=core.settings_demo
          python manage.py collectstatic --noinput --settings=core.settings_demo

      - name: Auditar segredos e dados reais
        run: python scripts/security/scan_repository.py

      - name: Executar testes integrais
        run: python manage.py test --settings=core.settings_test --noinput --verbosity=1
