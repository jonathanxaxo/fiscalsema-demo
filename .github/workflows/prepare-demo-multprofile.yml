name: Preparar perfis e carteira ficticia do FiscalSema Demo

on:
  workflow_dispatch:
    inputs:
      controller_email:
        description: E-mail da unica conta que podera alternar os cinco perfis
        required: true
        default: admin@exemplo.com.br
        type: string
      confirmacao:
        description: Digite PREPARAR DEMO para confirmar
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fiscalsema-demo-multprofile-portfolio
  cancel-in-progress: false

jobs:
  prepare-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.14.7-slim-bookworm
    env:
      APP_ENVIRONMENT: demo
      DJANGO_SETTINGS_MODULE: core.settings_demo
      ALLOWED_HOSTS: fiscalsema-demo.vercel.app
      CSRF_TRUSTED_ORIGINS: https://fiscalsema-demo.vercel.app
      FISCALSEMA_DEMO_DATABASE_URL: ${{ secrets.FISCALSEMA_DEMO_MIGRATION_DATABASE_URL }}
      DEMO_SWITCH_CONTROLLER_EMAIL: ${{ inputs.controller_email }}
      CONFIRMACAO: ${{ inputs.confirmacao }}
    steps:
      - name: Exigir confirmacao explicita
        run: test "$CONFIRMACAO" = "PREPARAR DEMO"

      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Exigir o segredo do banco
        run: test -n "$FISCALSEMA_DEMO_DATABASE_URL"

      - name: Gerar chave Django efemera
        run: |
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          echo "::add-mask::$key"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"

      - name: Instalar dependencias verificadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Validar configuracao e migrations aplicadas
        run: |
          python manage.py check --deploy
          python manage.py migrate --check

      - name: Habilitar os cinco perfis para a conta controladora
        run: python manage.py enable_demo_multprofile_switch

      - name: Criar a carteira ficticia idempotente
        run: python manage.py seed_demo_portfolio

      - name: Confirmar protecoes e cobertura dos perfis
        run: |
          python manage.py shell -c "import os; from accounts.models import DemoProfileSwitch, DemoProfileSwitchTarget, User; email=User.objects.normalize_login_email(os.environ['DEMO_SWITCH_CONTROLLER_EMAIL']); switch=DemoProfileSwitch.objects.get(controller__email__iexact=email); assert DemoProfileSwitch.objects.count() == 1; assert switch.targets.count() == 5; assert all(not target.user.has_usable_password() for target in switch.targets.select_related('user').filter(is_internal=True)); print('PASS | Uma conta controladora, cinco perfis e contas internas sem login direto')"
          python manage.py inventory_functional_profiles
