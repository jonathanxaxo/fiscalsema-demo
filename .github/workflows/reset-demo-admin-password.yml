name: Redefinir senha do administrador do FiscalSema Demo

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: E-mail (login) do Administrador que tera a senha redefinida
        required: true
        type: string
      confirmacao:
        description: Digite REDEFINIR para confirmar
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fiscalsema-demo-initial-administrator
  cancel-in-progress: false

jobs:
  reset-administrator-password:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.14.7-slim-bookworm
    env:
      APP_ENVIRONMENT: demo
      DJANGO_SETTINGS_MODULE: core.settings_demo
      ALLOWED_HOSTS: fiscalsema-demo.vercel.app
      CSRF_TRUSTED_ORIGINS: https://fiscalsema-demo.vercel.app
      FISCALSEMA_DEMO_DATABASE_URL: ${{ secrets.FISCALSEMA_DEMO_MIGRATION_DATABASE_URL }}
      DEMO_ADMIN_EMAIL: ${{ inputs.admin_email }}
      DEMO_ADMIN_PASSWORD: ${{ secrets.FISCALSEMA_DEMO_ADMIN_PASSWORD }}
      CONFIRMACAO: ${{ inputs.confirmacao }}
    steps:
      - name: Exigir confirmacao explicita
        run: test "$CONFIRMACAO" = "REDEFINIR"

      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Exigir os segredos necessarios
        run: |
          test -n "$FISCALSEMA_DEMO_DATABASE_URL"
          test -n "$DEMO_ADMIN_PASSWORD"

      - name: Gerar chave Django efemera
        run: python -c "import secrets; print('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(64))" >> "$GITHUB_ENV"

      - name: Instalar dependencias verificadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Validar configuracao
        run: python manage.py check --deploy

      - name: Redefinir a senha do Administrador
        run: python manage.py reset_demo_admin_password

      - name: Confirmar acesso com a nova senha
        run: |
          python manage.py shell -c "import os; from django.contrib.auth import authenticate; from accounts.models import UserProfile; user = authenticate(email=os.environ['DEMO_ADMIN_EMAIL'], password=os.environ['DEMO_ADMIN_PASSWORD']); assert user is not None; assert user.profile == UserProfile.ADMINISTRATOR and user.is_superuser and user.is_active; print('PASS | Administrador autentica com a nova senha')"
