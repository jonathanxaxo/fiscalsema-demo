name: Senha temporaria de uma conta do FiscalSema Demo

on:
  workflow_dispatch:
    inputs:
      account_email:
        description: E-mail da conta que recebera a senha temporaria
        required: true
        type: string
      confirmation:
        description: Digite REDEFINIR para confirmar
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fiscalsema-demo-temporary-password
  cancel-in-progress: false

jobs:
  reset-password:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.14.7-slim-bookworm
    env:
      APP_ENVIRONMENT: demo
      DJANGO_SETTINGS_MODULE: core.settings_demo
      ALLOWED_HOSTS: fiscalsema-demo.vercel.app
      CSRF_TRUSTED_ORIGINS: https://fiscalsema-demo.vercel.app
      FISCALSEMA_DEMO_DATABASE_URL: ${{ secrets.FISCALSEMA_DEMO_MIGRATION_DATABASE_URL }}
      DEMO_RESET_EMAIL: ${{ inputs.account_email }}
      DEMO_TEMP_PASSWORD: ${{ secrets.FISCALSEMA_DEMO_TEMP_PASSWORD }}
    steps:
      - name: Exigir confirmacao explicita
        if: ${{ inputs.confirmation != 'REDEFINIR' }}
        run: |
          echo "Confirmacao ausente: digite REDEFINIR."
          exit 1

      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Exigir os segredos necessarios
        run: |
          test -n "$FISCALSEMA_DEMO_DATABASE_URL"
          test -n "$DEMO_TEMP_PASSWORD"

      - name: Gerar chave Django efemera
        run: python -c "import secrets; print('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(64))" >> "$GITHUB_ENV"

      - name: Instalar dependencias verificadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Definir senha temporaria
        run: python manage.py set_demo_temporary_password

      - name: Confirmar troca obrigatoria no proximo acesso
        run: |
          python manage.py shell -c "import os; from accounts.models import User; u = User.objects.get(email=User.objects.normalize_login_email(os.environ['DEMO_RESET_EMAIL'])); assert u.must_change_password; print('PASS | troca de senha obrigatoria no proximo acesso')"
